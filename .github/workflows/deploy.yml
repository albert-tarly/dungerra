name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Deploys run one at a time, in push order
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm run format:check

      # Not deployed here (the desktop app bundles it); built so a change
      # that breaks the desktop target fails before reaching main's deploy
      - name: Build desktop target
        run: npm run build:desktop

      - name: Build
        run: npm run build

      # GitHub Pages serves the docs/ folder of the gh-pages branch. Replace
      # that folder with the fresh build; main is never merged into gh-pages.
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/pages" FETCH_HEAD
          rm -rf "$RUNNER_TEMP/pages/docs"
          cp -r dist "$RUNNER_TEMP/pages/docs"
          cd "$RUNNER_TEMP/pages"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Build unchanged; nothing to deploy"
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
